  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8da1c8c5-51c1-46bc-acdb-32f70721f792\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e6525c4b-1a36-4303-8160-99156bc4ff24\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2a092b1b-6dff-49f6-8ad3-a928fb5e52a8\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"95690f1a-c09b-4699-8ef6-d1b90fff4c57\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d2918780-66a8-45ab-961a-7573760e2ba1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"02900563-6ef2-4b71-a6d4-261e9aa974e7\"><\u002Fscript>\n<script src=\"27c63c03-f149-42ba-b2cb-b12c2d1f0653\"><\u002Fscript>\n<style>\nbody{margin:0;background:#f1f1ef;color:#17191a;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}\na{color:#157a52}a:hover{color:#0f5c3d}\ninput,button,select{font-family:inherit}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n<div style=\"max-width:520px;margin:0 auto;min-height:100dvh;box-sizing:border-box;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:16px\">\n\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between\">\n    <div>\n      <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#8a8d8c\">BS&nbsp;SCAN · ANDROID<\u002Fdiv>\n      <div style=\"font-size:26px;font-weight:700;letter-spacing:-.3px;margin-top:6px\">{{ viewTitle }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font:500 11px/1.5 'IBM Plex Mono',monospace;color:#8a8d8c;text-align:right;white-space:pre-line\">{{ headMeta }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <input type=\"file\" accept=\"image/*\" capture=\"environment\" multiple=\"{{ true }}\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onFiles }}\" style=\"display:none\">\n\n  <sc-if value=\"{{ vHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div sc-camel-on-click=\"{{ startNewDoc }}\" style=\"background:#157a52;color:#fff;border-radius:14px;padding:20px;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.18)\">\n      <div style=\"font-size:18px;font-weight:600\">{{ mainCta }}<\u002Fdiv>\n      <div style=\"font:400 11px/1.5 'IBM Plex Mono',monospace;color:rgba(255,255,255,.75);margin-top:6px\">KAMERA · KANTEN&nbsp;WERDEN&nbsp;AUTOMATISCH&nbsp;ERKANNT<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#8a8d8c\">BILDMODUS<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ m.pick }}\" style=\"flex:1;padding:11px 4px;border-radius:9px;text-align:center;font:500 11.5px/1 'IBM Plex Mono',monospace;cursor:pointer;background:{{ m.bg }};color:{{ m.fg }};border:1px solid {{ m.bd }}\">{{ m.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#8a8d8c;margin-top:2px\">KOMPRESSION<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <sc-for list=\"{{ profiles }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ p.pick }}\" style=\"flex:1;padding:11px 4px;border-radius:9px;text-align:center;font:500 11.5px/1 'IBM Plex Mono',monospace;cursor:pointer;background:{{ p.bg }};color:{{ p.fg }};border:1px solid {{ p.bd }}\">{{ p.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasDocs }}\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n        <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#8a8d8c\">STAPEL — {{ docCountLabel }}<\u002Fdiv>\n        <div style=\"font:400 10px/1 'IBM Plex Mono',monospace;color:#a3a6a4\">SEITE&nbsp;ANTIPPEN&nbsp;=&nbsp;RAND&nbsp;KORRIGIEREN<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ docs }}\" as=\"doc\">\n        <div style=\"background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n            <div style=\"font:600 12px/1.3 'IBM Plex Mono',monospace\">{{ doc.title }}<\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:center\">\n              <div sc-camel-on-click=\"{{ doc.addPage }}\" style=\"font-size:12.5px;font-weight:600;color:#157a52;cursor:pointer\">+ Seite<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ doc.remove }}\" style=\"font-size:12px;color:#a8564c;cursor:pointer\">Löschen<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px\">\n            <sc-for list=\"{{ doc.pages }}\" as=\"p\">\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <div sc-camel-on-click=\"{{ p.edit }}\" style=\"width:100%;aspect-ratio:.72;border-radius:5px;background:#e8e7e3;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center\">{{ p.thumb }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between\">\n                  <div style=\"font:500 9px/1 'IBM Plex Mono',monospace;color:#7c807e\">{{ p.label }}<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ p.remove }}\" style=\"font-size:10px;color:#a8564c;cursor:pointer\">✕<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n        <sc-for list=\"{{ langs }}\" as=\"l\" hint-placeholder-count=\"2\">\n          <div sc-camel-on-click=\"{{ l.pick }}\" style=\"padding:9px 12px;border-radius:999px;font:500 11.5px/1 'IBM Plex Mono',monospace;cursor:pointer;background:{{ l.bg }};color:{{ l.fg }};border:1px solid {{ l.bd }}\">{{ l.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ startPipeline }}\" style=\"background:#17191a;color:#fff;border-radius:12px;padding:16px;text-align:center;font-size:16.5px;font-weight:600;cursor:pointer\">{{ ocrCta }}<\u002Fdiv>\n      <div style=\"font:400 11px/1.6 'IBM Plex Mono',monospace;color:#8a8d8c\">JEDES&nbsp;DOKUMENT&nbsp;WIRD&nbsp;EINZELN&nbsp;VERARBEITET, BENANNT&nbsp;UND&nbsp;GESPEICHERT<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ noDocs }}\">\n    <div style=\"border:1.5px dashed rgba(0,0,0,.2);border-radius:12px;padding:24px 18px;text-align:center;font:400 12px/1.7 'IBM Plex Mono',monospace;color:#8a8d8c\">NOCH&nbsp;NICHTS&nbsp;ERFASST<br>SIE&nbsp;WERDEN&nbsp;NACH&nbsp;JEDER&nbsp;SEITE&nbsp;GEFRAGT,<br>OB&nbsp;WEITERE&nbsp;SEITEN&nbsp;ODER&nbsp;DOKUMENTE&nbsp;FOLGEN<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ vCrop }}\">\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font:400 11.5px/1.6 'IBM Plex Mono',monospace;color:#8a8d8c\">{{ cropHint }}<\u002Fdiv>\n    <div ref=\"{{ cropRef }}\" sc-camel-on-pointer-move=\"{{ onDrag }}\" sc-camel-on-pointer-up=\"{{ endDrag }}\" sc-camel-on-pointer-leave=\"{{ endDrag }}\" style=\"position:relative;background:#17191a;border-radius:12px;overflow:hidden;touch-action:none;user-select:none;display:flex;align-items:center;justify-content:center;min-height:300px\">\n      {{ cropImg }}\n      <svg sc-camel-view-box=\"0 0 100 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%;pointer-events:none\">\n        <polygon points=\"{{ poly }}\" fill=\"rgba(21,122,82,.18)\" stroke=\"#3ecf92\" stroke-width=\"0.5\" vector-effect=\"non-scaling-stroke\"><\u002Fpolygon>\n      <\u002Fsvg>\n      <sc-for list=\"{{ handles }}\" as=\"h\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-pointer-down=\"{{ h.grab }}\" style=\"position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;left:{{ h.left }};top:{{ h.top }};display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none\">\n          <div style=\"width:20px;height:20px;border-radius:50%;background:rgba(21,122,82,.9);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px\">\n      <div sc-camel-on-click=\"{{ autoDetect }}\" style=\"flex:1;padding:13px 6px;border-radius:11px;border:1px solid rgba(0,0,0,.14);background:#fff;text-align:center;font:500 11.5px/1 'IBM Plex Mono',monospace;cursor:pointer\">AUTOMATISCH<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ fullPage }}\" style=\"flex:1;padding:13px 6px;border-radius:11px;border:1px solid rgba(0,0,0,.14);background:#fff;text-align:center;font:500 11.5px/1 'IBM Plex Mono',monospace;cursor:pointer\">GANZES&nbsp;BILD<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ rotateCrop }}\" style=\"flex:1;padding:13px 6px;border-radius:11px;border:1px solid rgba(0,0,0,.14);background:#fff;text-align:center;font:500 11.5px/1 'IBM Plex Mono',monospace;cursor:pointer\">DREHEN&nbsp;90°<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px\">\n      <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"3\">\n        <div sc-camel-on-click=\"{{ m.pick }}\" style=\"flex:1;padding:11px 4px;border-radius:9px;text-align:center;font:500 11.5px/1 'IBM Plex Mono',monospace;cursor:pointer;background:{{ m.bg }};color:{{ m.fg }};border:1px solid {{ m.bd }}\">{{ m.label }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px\">\n      <div sc-camel-on-click=\"{{ cancelCrop }}\" style=\"padding:16px 18px;border-radius:12px;border:1px solid rgba(0,0,0,.14);background:#fff;font-size:16px;cursor:pointer\">Verwerfen<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ applyCrop }}\" style=\"flex:1;background:#157a52;color:#fff;border-radius:12px;padding:16px;text-align:center;font-size:16.5px;font-weight:600;cursor:pointer\">{{ applyLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ vAsk }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#157a52\">{{ askKicker }}<\u002Fdiv>\n      <div style=\"font-size:19px;font-weight:600;line-height:1.35;text-wrap:pretty\">{{ askTitle }}<\u002Fdiv>\n      <div style=\"font:400 11.5px/1.6 'IBM Plex Mono',monospace;color:#8a8d8c\">{{ askMeta }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div sc-camel-on-click=\"{{ askYes }}\" style=\"background:#157a52;color:#fff;border-radius:12px;padding:18px;text-align:center;font-size:17px;font-weight:600;cursor:pointer\">{{ askYesLabel }}<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ askNo }}\" style=\"border:1px solid rgba(0,0,0,.16);background:#fff;border-radius:12px;padding:18px;text-align:center;font-size:16.5px;cursor:pointer\">{{ askNoLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font:400 11px/1.7 'IBM Plex Mono',monospace;color:#a3a6a4\">{{ askFoot }}<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ vProc }}\">\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:12px;padding:18px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px\">\n        <div style=\"font:500 11px/1.4 'IBM Plex Mono',monospace;color:#7c807e\">{{ procStage }}<\u002Fdiv>\n        <div style=\"font:600 22px/1 'IBM Plex Mono',monospace;color:#157a52\">{{ procPctLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:5px;background:rgba(0,0,0,.09);border-radius:4px;overflow:hidden\">\n        <div style=\"height:5px;background:#157a52;border-radius:4px;width:{{ procW }}\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font:400 11.5px/1.7 'IBM Plex Mono',monospace;color:#8a8d8c\">BITTE&nbsp;GEÖFFNET&nbsp;LASSEN · SPRACHE&nbsp;{{ langLabel }}<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ cancelProc }}\" style=\"align display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#8a8d8c\">SPEICHERORT WÄHLEN<\u002Fdiv>\n      <sc-for list=\"{{ targets }}\" as=\"t\">\n        <div sc-camel-on-click=\"{{ t.pick }}\" style=\"border:1px solid {{ t.bd }};background:{{ t.bg }};border-radius:11px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:5px;opacity:{{ t.op }}\">\n          <div style=\"font-size:15.5px;font-weight:600\">{{ t.label }}<\u002Fdiv>\n          <div style=\"font:400 10.5px/1.5 'IBM Plex Mono',monospace;color:#7c807e\">{{ t.note }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasSaveMsg }}\">\n    <div style=\"background:#f6f6f4;border:1px solid rgba(0,0,0,.1);border-radius:11px;padding:13px;font:400 11.5px/1.65 'IBM Plex Mono',monospace;color:#5b5f5c\">{{ saveMsg }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;flex-direction:column;gap:9px\">{{ pdfLinks }}<\u002Fdiv>\n\n    <div sc-camel-on-click=\"{{ nextDoc }}\" style=\"background:#17191a;color:#fff;border-radius:12px;padding:16px;text-align:center;font-size:16.5px;font-weight:600;cursor:pointer\">{{ nextLabel }}<\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:9px\">\n      <div sc-camel-on-click=\"{{ toggleText }}\" style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;color:#7c807e;cursor:pointer\">{{ textToggleLabel }}<\u002Fdiv>\n      <sc-if value=\"{{ textOpen }}\">\n      <div style=\"max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:7px;border-top:1px solid rgba(0,0,0,.07);padding-top:10px\">\n        <sc-for list=\"{{ textLines }}\" as=\"l\">\n          <div style=\"border-left:3px solid rgba(0,0,0,.12);padding:2px 0 2px 10px;font-size:13.5px;line-height:1.5;text-wrap:pretty\">{{ l.text }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ vDone }}\">\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <div style=\"background:#e9f2ec;border:1px solid rgba(21,122,82,.22);border-radius:12px;padding:16px\">\n      <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#157a52;margin-bottom:8px\">STAPEL ABGESCHLOSSEN<\u002Fdiv>\n      <div style=\"font:600 14.5px/1.5 'IBM Plex Mono',monospace\">{{ doneSummary }}<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ doneList }}\" as=\"d\">\n      <div style=\"background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:7px\">\n        <div style=\"font:500 12px/1.5 'IBM Plex Mono',monospace;word-break:break-all\">{{ d.name }}<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n          <div style=\"font:400 10.5px/1 'IBM Plex Mono',monospace;color:#7c807e\">{{ d.meta }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ d.again }}\" style=\"font-size:12.5px;font-weight:600;color:#157a52;cursor:pointer\">nochmal speichern<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div sc-camel-on-click=\"{{ reset }}\" style=\"background:#157a52;color:#fff;border-radius:12px;padding:16px;text-align:center;font-size:16.5px;font-weight:600;cursor:pointer\">Neuer Stapel<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasError }}\">\n  <div style=\"background:#f6ebe6;border:1px solid rgba(168,86,76,.3);border-radius:12px;padding:14px;font:400 12px/1.6 'IBM Plex Mono',monospace;color:#8f463d\">{{ error }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"flex:1\"><\u002Fdiv>\n  <div style=\"font:400 10.5px/1.7 'IBM Plex Mono',monospace;color:#a3a6a4\">{{ envLine }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:892}}\">\nconst MODES = [{ id: \"sw\", label: \"S/W\" }, { id: \"grau\", label: \"GRAU\" }, { id: \"farbe\", label: \"FARBE\" }];\nconst PROFILES = [\n  { id: \"min\", label: \"KLEINST\", q: 0.55, max: 1700 },\n  { id: \"std\", label: \"STANDARD\", q: 0.72, max: 2200 },\n  { id: \"max\", label: \"MAXIMAL\", q: 0.88, max: 2800 },\n];\nconst LANGS = [{ id: \"deu\", label: \"DEUTSCH\" }, { id: \"deu+eng\", label: \"DEUTSCH+ENGLISCH\" }];\nconst AZ_RE = /\\b\\d{1,3}\\s?[A-Za-z]{1,3}\\s?\\d{1,4}\\/\\d{2}\\b/g;\nconst DATE_RE = /\\b(\\d{2})\\.(\\d{2})\\.(\\d{4})\\b/g;\nconst TYPES = [\n  [/klageerwiderung/i, \"Klageerwiderung\"], [/klageschrift|klage\\b/i, \"Klage\"],\n  [/berufungsbegr/i, \"Berufungsbegruendung\"], [/berufung/i, \"Berufung\"],\n  [/beschwerde/i, \"Beschwerde\"], [/verf(ü|ue)gung/i, \"Verfuegung\"],\n  [/beschluss/i, \"Beschluss\"], [/urteil/i, \"Urteil\"], [/vers(ä|ae)umnis/i, \"Versaeumnisurteil\"],\n  [/bescheid/i, \"Bescheid\"], [/mahnung|mahnbescheid/i, \"Mahnung\"],\n  [/rechnung/i, \"Rechnung\"], [/vollmacht/i, \"Vollmacht\"], [/protokoll/i, \"Protokoll\"],\n  [/stellungnahme/i, \"Stellungnahme\"], [/schriftsatz/i, \"Schriftsatz\"],\n  [/k(ü|ue)ndigung/i, \"Kuendigung\"], [/vertrag/i, \"Vertrag\"], [/gutachten/i, \"Gutachten\"],\n];\nconst ORGS = [\n  [/landgericht\\s+([A-ZÄÖÜ][a-zäöüß\\-]+)/i, \"LG-$1\"], [/amtsgericht\\s+([A-ZÄÖÜ][a-zäöüß\\-]+)/i, \"AG-$1\"],\n  [/oberlandesgericht\\s+([A-ZÄÖÜ][a-zäöüß\\-]+)/i, \"OLG-$1\"], [/arbeitsgericht\\s+([A-ZÄÖÜ][a-zäöüß\\-]+)/i, \"ArbG-$1\"],\n  [/verwaltungsgericht\\s+([A-ZÄÖÜ][a-zäöüß\\-]+)/i, \"VG-$1\"], [/sozialgericht\\s+([A-ZÄÖÜ][a-zäöüß\\-]+)/i, \"SG-$1\"],\n  [/finanzgericht\\s+([A-ZÄÖÜ][a-zäöüß\\-]+)/i, \"FG-$1\"], [/finanzamt\\s+([A-ZÄÖÜ][a-zäöüß\\-]+)/i, \"FA-$1\"],\n];\nconst mb = (b) => (b / 1048576).toFixed(b < 1048576 ? 2 : 1).replace(\".\", \",\") + \" MB\";\nconst slug = (s) => (s || \"\").trim().replace(/[^\\wÄÖÜäöüß\\- ]+/g, \"\").replace(/\\s+/g, \"-\").replace(/-+/g, \"-\").replace(/^-|-$/g, \"\");\nconst DEFAULT_QUAD = [{ x: .06, y: .06 }, { x: .94, y: .06 }, { x: .94, y: .94 }, { x: .06, y: .94 }];\nconst uid = () => Math.random().toString(36).slice(2);\nconst seiten = (n) => (n === 1 ? \"1 Seite\" : n + \" Seiten\");\n\nfunction loadImage(src) {\n  return new Promise((res, rej) => {\n    const i = new Image();\n    i.onload = () => res(i);\n    i.onerror = () => rej(new Error(\"Bild nicht lesbar\"));\n    i.src = src;\n  });\n}\n\nfunction suggestName(text) {\n  const parts = [];\n  for (const [re, tpl] of ORGS) {\n    const m = text.match(re);\n    if (m) { parts.push(tpl.replace(\"$1\", m[1])); break; }\n  }\n  const az = (text.match(AZ_RE) || [])[0];\n  if (az) parts.push(slug(az.replace(/\\s+/g, \" \").trim().replace(/\\//g, \"-\")));\n  for (const [re, name] of TYPES) if (re.test(text)) { parts.push(name); break; }\n  const dm = DATE_RE.exec(text);\n  DATE_RE.lastIndex = 0;\n  parts.push(dm ? dm[3] + \"-\" + dm[2] + \"-\" + dm[1] : new Date().toISOString().slice(0, 10));\n  return parts.filter(Boolean).join(\"_\") || \"Dokument_\" + new Date().toISOString().slice(0, 10);\n}\n\nconst IS_MOBILE = /Android|iPhone|iPad/i.test(navigator.userAgent);\n\n// OCR auf verkleinerter Kopie — spart auf dem Handy Speicher, Textebene bleibt gleich genau\nasync function ocrSource(page) {\n  const cap = IS_MOBILE ? 1500 : 2200;\n  if (Math.max(page.w, page.h) <= cap) return { src: page.src, w: page.w };\n  const img = await loadImage(page.src);\n  const s = cap / Math.max(img.width, img.height);\n  const c = document.createElement(\"canvas\");\n  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);\n  c.getContext(\"2d\").drawImage(img, 0, 0, c.width, c.height);\n  return { src: c.toDataURL(\"image/jpeg\", 0.85), w: c.width };\n}\n\nfunction detectQuad(img) {\n  const W = 320, H = Math.max(1, Math.round((img.height / img.width) * W));\n  const c = document.createElement(\"canvas\");\n  azs = cur ? [...new Set((cur.text.match(AZ_RE) || []).map((x) => x.replace(/\\s+/g, \" \").trim()))].slice(0, 2) : [];\n    const chips = [];\n    if (cur) {\n      chips.push({ label: \"VORSCHLAG ERNEUT\", apply: () => this.setState({ nameInput: suggestName(cur.text) }) });\n      azs.forEach((a) => chips.push({ label: \"AZ \" + a, apply: () => this.setState((st) => ({ nameInput: slug(a.replace(/\\//g, \"-\")) + \"_\" + st.nameInput })) }));\n      chips.push({ label: \"DATUM HEUTE\", apply: () => this.setState((st) => ({ nameInput: st.nameInput + \"_\" + new Date().toISOString().slice(0, 10) })) });\n    }\n\n    return {\n      fileRef: this.fileRef, cropRef: this.cropRef, onFiles: this.onFiles,\n      vHome: s.view === \"home\", vCrop: s.view === \"crop\", vAsk: s.view === \"ask\",\n      vProc: s.view === \"proc\", vSave: s.view === \"save\", vDone: s.view === \"done\",\n      viewTitle: s.view === \"crop\" ? \"Rand prüfen\" : s.view === \"ask\" ? \"Weiter?\" : s.view === \"proc\" ? \"Verarbeitung\"\n        : s.view === \"save\" ? \"Benennen & speichern\" : s.view === \"done\" ? \"Fertig\" : \"Stapel erfassen\",\n      headMeta: s.view === \"crop\"\n        ? (s.queue.length ? \"noch \" + (s.queue.length + 1) + \" Aufnahmen\" : \"1 Aufnahme\")\n        : s.view === \"save\" || s.view === \"proc\"\n          ? (s.order.length ? \"Dokument \" + (s.cursor + 1) + \" von \" + s.order.length : \"\")\n          : filled.length ? filled.length + (filled.length === 1 ? \" Dokument\\n\" : \" Dokumente\\n\") + seiten(totalPages) + \" · \" + mb(totalBytes)\n          : s.view === \"ask\" ? \"Seite verarbeitet\" : \"bereit\",\n\n      startNewDoc: this.startNewDoc,\n      mainCta: filled.length ? \"Weiteres Dokument scannen\" : \"Dokument scannen\",\n      hasDocs: filled.length > 0, noDocs: filled.length === 0,\n      docCountLabel: filled.length + (filled.length === 1 ? \" DOKUMENT · \" : \" DOKUMENTE · \") + seiten(totalPages).toUpperCase(),\n      docs: filled.map((doc, di) => ({\n        title: \"DOK \" + String(di + 1).padStart(2, \"0\") + \" · \" + seiten(doc.pages.length),\n        addPage: () => this.addToDoc(doc.id),\n        remove: () => this.setState((st) => ({ docs: st.docs.filter((x) => x.id !== doc.id) })),\n        pages: doc.pages.map((p, i) => ({\n          label: String(i + 1).padStart(2, \"0\") + \" · \" + mb(p.bytes),\n          thumb: React.createElement(\"img\", { src: p.src, alt: \"Seite \" + (i + 1), style: { width: \"100%\", height: \"100%\", objectFit: \"contain\" } }),\n          edit: () => this.editPage(doc.id, p),\n          remove: () => this.setState((st) => ({ docs: st.docs.map((x) => (x.id === doc.id ? { ...x, pages: x.pages.filter((y) => y.id !== p.id) } : x)) })),\n        })),\n      })),\n      modes: MODES.map((m) => ({ label: m.label, pick: () => this.setState({ mode: m.id }), ...chip(s.mode === m.id) })),\n      profiles: PROFILES.map((p) => ({ label: p.label, pick: () => this.setState({ profile: p.id }), ...chip(s.profile === p.id) })),\n      langs: LANGS.map((l) => ({ label: l.label, pick: () => this.setState({ lang: l.id }), ...chip(s.lang === l.id) })),\n      langLabel: (LANGS.find((l) => l.id === s.lang) || LANGS[0]).label,\n      ocrCta: filled.length > 1 ? \"Alle \" + filled.length + \" Dokumente verarbeiten\" : \"Dokument verarbeiten\",\n      startPipeline: this.startPipeline,\n\n      cropImg: d && d.src ? React.createElement(\"img\", { src: d.src, alt: \"Aufnahme\", style: { maxWidth: \"100%\", maxHeight: \"58dvh\", display: \"block\" } }) : null,\n      cropHint: d ? (d.auto ? \"KANTEN AUTOMATISCH ERKANNT — PUNKTE BEI BEDARF VERSCHIEBEN\" : \"KEINE KANTE SICHER ERKANNT — PUNKTE AUF DIE BLATTECKEN ZIEHEN\") : \"\",\n      poly: quad.map((p) => (p.x * 100).toFixed(2) + \",\" + (p.y * 100).toFixed(2)).join(\" \"),\n      handles: quad.map((p, i) => ({ left: pct(p.x), top: pct(p.y), grab: (e) => { e.preventDefault(); this.setState({ drag: i }); } })),\n      onDrag: (e) => {\n        if (s.drag < 0 || !s.draft) return;\n        const el = this.cropRef.current;\n        if (!el) return;\n        const img = el.querySelector(\"img\");\n        const r = (img || el).getBoundingClientRect();\n        const pt = { x: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), y: Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)) };\n        this.setState((st) => ({ draft: { ...st.draft, quad: st.draft.quad.map((p, k) => (k === s.drag ? pt : p)) } }));\n      },\n      endDrag: () => { if (s.drag >= 0) this.setState({ drag: -1 }); },\n      autoDetect: async () => {\n        if (!s.draft) return;\n        const det = detectQuad(await loadImage(s.draft.src));\n        this.setState((st) => ({ draft: { ...st.draft, quad: det.quad, auto: det.auto } }));\n      },\n      fullPage: () => this.setState((st) => ({ draft: { ...st.draft, quad: [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 1, y: 1 }, { x: 0, y: 1 }], auto: false } })),\n      rotateCrop: () => this.setState((st) => ({ draft: { ...st.draft, quad: [st.draft.quad[3], st.draft.quad[0], st.draft.quad[1], st.draft.quad[2]] } })),\n      applyCrop: this.applyCrop,\n      applyLabel: s.queue.length ? \"Übernehmen (\" + (s.queue.length + 1) + \")\" : \"Übernehmen\",\n      cancelCrop: () => this.setState((st) => (st.queue.length\n        ? { draft: st.queue[0], queue: st.queue.slice(1) }\n        : { view: st.docs.some((x) => x.pages.length) ? \"ask\" : \"home\", askMode: \"page\", draft: null })),\n\n      askKicker: s.askMode === \"page\" ? \"SEITE GESPEICHERT\" : \"DOKUMENT ABGESCHLOSSEN\",\n      askTitle: s.askMode === \"page\" ? \"Weitere Seite zu diesem Dokument?\" : \"Weiteres Dokument scannen?\",\n      askMeta: s.askMode === \"page\"\n        ? \"DOK \" + String(activeIdx + 1).padStart(2, \"0\") + \" · \" + seiten(active ? active.pages.length : 0)\n        : filled.length + (filled.length === 1 ? \" DOKUMENT\" : \" DOKUMENTE\") + \" IM STAPEL · \" + seiten(totalPages).toUpperCase(),\n      askYesLabel: s.askMode === \"page\" ? \"Ja — nächste Seite aufnehmen\" : \"Ja — neues Dokument\",\n      askNoLabel: s.askMode === \"page\" ? \"Nein — Dokument abschließen\" : \"Nein — verarbeiten und speichern\",\n      askFoot: s.askMode === \"page\"\n        ? \"NEIN FRAGT ANSCHLIESSEND, OB EIN WEITERES DOKUMENT FOLGT.\"\n        : \"NEIN STARTET DIE TEXTERKENNUNG: JEDES DOKUMENT WIRD EINZELN BENANNT UND GESPEICHERT.\",\n      askYes: () => {\n        if (s.askMode === \"page\") this.setState({ view: \"home\" }, this.shoot);\n        else this.startNewDoc();\n      },\n      askNo: () => {\n        if (s.askMode === \"page\") this.setState({ askMode: \"doc\", activeDoc: null });\n        else this.startPipeline();\n      },\n\n      procStage: s.stage, procPctLabel: s.pct + \" %\", procW: s.pct + \"%\",\n      cancelProc: () => this.setState({ cancel: true, view: \"home\" }),\n\n      saveKicker: \"DOKUMENT \" + (s.cursor + 1) + \" VON \" + s.order.length + \" — PDF MIT TEXTEBENE FERTIG\",\n      saveSize: cur ? mb(cur.bytes) + \" · \" + seiten(cur.pages) : \"\",\n      saveNote: \"Name aus dem erkannten Text vorgeschlagen — bei Bedarf ändern, dann Speicherort wählen.\",\n      nameInput: s.nameInput, setName: (e) => this.setState({ nameInput: e.target.value }),\n      finalName: this.finalName(),\n      nameChips: chips, hasNameChips: chips.length > 0,\n      targets: [\n        { id: \"share\", label: \"Teilen / App wählen\", note: canShare ? \"GMAIL, DRIVE, WHATSAPP, DATEIEN …\" : (secure ? \"DIESER BROWSER BIETET KEIN TEILEN-MENÜ\" : \"BRAUCHT HTTPS-AUFRUF\"), on: canShare },\n        { id: \"folder\", label: \"Ordner wählen und dort ablegen\", note: window.showDirectoryPicker ? (s.dirHandle ? \"ORDNER GEWÄHLT — WEITERE DOKUMENTE LANDEN DORT\" : \"NUR IN DESKTOP-CHROME/EDGE\") : \"VON DIESEM BROWSER NICHT UNTERSTÜTZT\", on: !!window.showDirectoryPicker },\n      ].map((t) => ({\n        label: t.label, note: t.note, op: t.on ? \"1\" : \".5\",\n        bg: t.on ? \"#fff\" : \"#f6f6f4\", bd: t.on ? \"rgba(0,0,0,.12)\" : \"rgba(0,0,0,.08)\",\n        pick: () => this.saveTo(t.id),\n      })),\n      saveMsg: s.saveMsg, hasSaveMsg: !!s.saveMsg,\n      showViewer: false,\n      pdfLinks: cur ? (() => {\n        const name = this.finalName();\n        const base = { display: \"block\", textAlign: \"center\", padding: \"15px\", borderRadius: \"11px\", fontSize: \"15.5px\", fontWeight: 600, textDecoration: \"none\" };\n        const note = (t, col) => React.createElement(\"div\", { style: { font: \"400 10.5px/1.5 'IBM Plex Mono',monospace\", color: col, marginTop: \"4px\", fontWeight: 400, wordBreak: \"break-all\" } }, t);\n        return [\n          React.createElement(\"a\", {\n            key: \"dl\", href: cur.url, download: name,\n            onClick: () => this.saveTo(\"markOnly\"),\n            style: { ...base, background: \"#157a52\", color: \"#fff\" },\n          }, \"PDF speichern (Download-Ordner)\", note(\"NAME: \" + name, \"rgba(255,255,255,.82)\")),\n          React.createElement(\"a\", {\n            key: \"op\", href: cur.url, target: \"_blank\", rel: \"noopener\",\n            style: { ...base, background: \"#fff\", color: \"#17191a\", border: \"1px solid rgba(0,0,0,.14)\" },\n          }, \"PDF im Browser öffnen\", note(\"NEUER TAB — VON DORT SPEICHERN ODER DRUCKEN\", \"#7c807e\")),\n        ];\n      })() : null,\n      nextDoc: () => {\n        const next = s.cursor + 1;\n        if (next >= s.order.length) this.setState({ view: \"done\" });\n        else this.processAt(next);\n      },\n      nextLabel: s.cursor + 1 >= s.order.length ? \"Fertig — Übersicht\" : \"Nächstes Dokument verarbeiten (\" + (s.cursor + 2) + \"/\" + s.order.length + \")\",\n      textOpen: s.textOpen,\n      toggleText: () => this.setState({ textOpen: !s.textOpen }),\n      textToggleLabel: s.textOpen ? \"ERKANNTEN TEXT AUSBLENDEN ▲\" : \"ERKANNTEN TEXT ANZEIGEN ▼\",\n      textLines: lines.slice(0, 200).map((t) => ({ text: t })),\n\n      doneSummary: s.saved.length\n        ? s.saved.length + (s.saved.length === 1 ? \" Dokument gespeichert · \" : \" Dokumente gespeichert · \") + mb(s.saved.reduce((a, x) => a + x.bytes, 0))\n        : \"Kein Dokument gespeichert — über „nochmal speichern“ nachholen.\",\n      doneList: s.saved.map((x) => ({\n        name: x.name, meta: seiten(x.pages) + \" · \" + mb(x.bytes),\n        again: () => {\n          const doc = s.docs.find((dd) => dd.id === x.id);\n          const idx = s.order.indexOf(x.id);\n          if (doc && idx >= 0) this.setState({ current: { id: x.id, pages: x.pages, bytes: x.bytes, text: \"\", url: URL.createObjectURL(this.blobs[x.id]) }, nameInput: x.name.replace(/\\.pdf$/, \"\"), cursor: idx, view: \"save\", saveMsg: \"\", showViewer: false });\n        },\n      })),\n      reset: () => { this.blobs = {}; this.setState({ view: \"home\", docs: [], activeDoc: null, order: [], cursor: 0, current: null, saved: [], rawBytes: 0, saveMsg: \"\", showViewer: false }); },\n      envLine: (secure\n        ? (canShare ? \"SICHERER KONTEXT · TEILEN VERFÜGBAR\" : \"SICHERER KONTEXT · KEIN TEILEN-MENÜ — DOWNLOAD NUTZEN\")\n        : \"OHNE HTTPS GEÖFFNET · TEILEN GESPERRT — DOWNLOAD ODER PDF ÖFFNEN NUTZEN\") + \" · VERARBEITUNG LOKAL\",\n      error: s.error, hasError: !!s.error,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
